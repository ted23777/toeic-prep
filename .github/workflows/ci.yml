name: CI

on:
  pull_request:
  push:
    branches: [main]

# Moindre privilège : lecture seule.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests et audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par hash de commit (le tag est indiqué en commentaire).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Audit des dépendances de développement
        run: npm audit --audit-level=high
